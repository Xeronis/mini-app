name: seguridad

on:
  push:
  pull_request:

jobs:
  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de seguridad
        run: pip install pip-audit bandit

      # SAST: analiza el codigo fuente buscando malas practicas
      - name: SAST con Bandit
        run: bandit -ll app.py

      # Escaneo de dependencias: falla si hay CVE conocidos
      - name: Dependencias con pip-audit
        run: pip-audit -r requirements.txt --no-deps --disable-pip
